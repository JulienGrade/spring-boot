
name: SonarQube - Spring Boot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    name: Analyse SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compiler le module principal
        run: |
          ./gradlew :core:spring-boot:classes \
            --no-daemon --stacktrace

      - name: Analyser avec SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonar \
            -Dsonar.gradle.skipCompile=true \
            --no-daemon --stacktrace

plugins {
    id "base"
    id "org.sonarqube" version "7.5.0.8588"
}

description = "Spring Boot Build"

defaultTasks 'build'

allprojects {
    group = "org.springframework.boot"
}

subprojects {
    apply plugin: "org.springframework.boot.conventions"

    repositories {
        mavenCentral()
        maven {
            name = "Shibboleth Releases"
            url = "https://build.shibboleth.net/nexus/content/repositories/releases"
            content {
                includeGroup "org.opensaml"
                includeGroup "net.shibboleth"
            }
        }
        spring.mavenRepositories()
    }

    configurations.all {
        resolutionStrategy.cacheChangingModulesFor 0, "minutes"
    }
}

// Configuration SonarQube Cloud
sonar {
    properties {
        property "sonar.projectKey", "JulienGrade_spring-boot2"
        property "sonar.organization", "juliengrade"
        property "sonar.host.url", "https://sonarcloud.io"

        // Analyser uniquement le module principal
        property "sonar.sources", "core/spring-boot/src/main/java"

        // Classes Java compilees
        property "sonar.java.binaries",
                "core/spring-boot/build/classes/java/main"

        // Ne pas analyser les tests pour ce premier essai
        property "sonar.tests", ""
        property "sonar.exclusions", "**/build/**"
    }
}

// Desactiver l'analyse des autres modules Gradle
subprojects {
    sonar {
        skipProject = true
    }
}
